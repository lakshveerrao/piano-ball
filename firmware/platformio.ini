; Piano Ball firmware - ESP32-C6 + MPU6050, ESP-IDF via PlatformIO
;   Build:   ~/.platformio/penv/Scripts/pio run -d firmware
;   Flash:   ~/.platformio/penv/Scripts/pio run -d firmware -t upload
;   Monitor: ~/.platformio/penv/Scripts/pio device monitor -d firmware -b 115200
[platformio]
default_envs = ball
src_dir = main

[env:ball]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags = -Wno-unused-function
